<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Profes del Tossal">
<title>Profes del Tossal</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --primario:#1e40af; --primario-osc:#1e3a8a; --acento:#3b82f6;
    --fondo:#ffffff; --tarjeta:#1e40af; --texto:#ffffff; --sub:#dbeafe;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--fondo);
    min-height:100vh; color:var(--texto);
    padding:0 16px calc(24px + env(safe-area-inset-bottom));
  }
  header{
    text-align:center; padding:40px 12px 24px; color:var(--primario-osc);
  }
  header .logo{font-size:52px; line-height:1;}
  header .logo img{height:72px; width:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
  header h1{font-size:1.55rem; font-weight:800; margin-top:10px; letter-spacing:.3px;}
  header p{opacity:.9; font-size:.95rem; margin-top:6px;}

  #installBtn{
    display:none; margin:0 auto 18px; border:none; cursor:pointer;
    background:var(--primario); color:#fff; font-weight:700; font-size:.95rem;
    padding:12px 22px; border-radius:999px; box-shadow:0 4px 14px rgba(30,64,175,.35);
  }
  #installBtn:active{transform:scale(.96);}

  .grid{
    display:grid; gap:14px; max-width:560px; margin:0 auto;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  }
  .btn-tarjeta{
    background:linear-gradient(150deg,#2563eb 0%,var(--primario) 60%,var(--primario-osc) 100%);
    border-radius:18px; padding:20px 14px 16px;
    text-align:center; text-decoration:none; color:#fff;
    box-shadow:0 6px 18px rgba(30,64,175,.35);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition:transform .12s ease; position:relative;
    cursor:pointer; user-select:none;
  }
  .btn-tarjeta:active{transform:scale(.95);}
  .btn-tarjeta .icono{
    width:56px;height:56px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px; color:var(--primario);
    background:#fff; box-shadow:0 2px 8px rgba(2,6,23,.2);
    position:relative; overflow:hidden;
  }
  .btn-tarjeta .icono img{
    position:absolute; inset:0; width:100%; height:100%;
    padding:13px; object-fit:contain; box-sizing:border-box;
  }
  .btn-tarjeta .titulo{font-weight:700; font-size:.98rem; line-height:1.25; color:#fff;}
  .btn-tarjeta .sub{font-size:.78rem; color:var(--sub);}

  /* ============ LOGIN ============ */
  #login{
    position:fixed; inset:0; z-index:100;
    background:var(--fondo);
    display:flex; align-items:center; justify-content:center; padding:20px;
    min-height:100vh; min-height:100dvh;
  }
  #login.oculto{display:none !important;}
  .login-caja{
    background:#fff; border:1.5px solid #e2e8f0; border-radius:22px; padding:32px 26px;
    width:100%; max-width:380px; text-align:center;
    box-shadow:0 10px 40px rgba(30,64,175,.15);
  }
  .login-caja .logo{font-size:48px; margin-bottom:4px; line-height:1;}
  .login-caja .logo img{height:64px; width:auto;}
  .login-caja h2{font-size:1.25rem; color:var(--primario-osc); margin:8px 0 4px;}
  .login-caja p.sub{font-size:.85rem; color:#64748b; margin-bottom:18px;}
  .login-caja input{
    width:100%; padding:13px 14px; border:1.5px solid #cbd5e1; border-radius:12px;
    font-size:1rem; outline:none; text-align:center; letter-spacing:2px;
  }
  .login-caja input:focus{border-color:var(--acento);}
  .login-caja input.err{border-color:#ef4444; animation:sacudida .3s;}
  @keyframes sacudida{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #loginError{color:#dc2626; font-size:.82rem; margin-top:10px; min-height:1.2em;}
  #entrarBtn{
    width:100%; margin-top:14px; border:none; border-radius:12px; padding:14px;
    background:var(--primario); color:#fff; font-size:1rem; font-weight:700; cursor:pointer;
  }
  #entrarBtn:active{transform:scale(.97);}
  .login-info{font-size:.72rem; color:#94a3b8; margin-top:14px;}

  /* ============ VISOR DE IMÁGENES ============ */
  #visor{
    position:fixed; inset:0; z-index:200; background:rgba(2,6,23,.92);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #visor.abierto{display:flex;}
  #visor img{max-width:100%; max-height:100%; object-fit:contain; border-radius:12px; background:#fff;}
  #visorCerrar{
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px;
    background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:999px;
    width:44px; height:44px; font-size:20px; cursor:pointer;
  }

  /* ============ SELECTOR DE HORARIOS ============ */
  #selector{
    position:fixed; inset:0; z-index:150; background:rgba(2,6,23,.55);
    display:none; align-items:flex-end; justify-content:center;
  }
  #selector.abierto{display:flex;}
  .selector-hoja{
    background:#fff; width:100%; max-width:520px; border-radius:22px 22px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;
  }
  .selector-hoja h2{font-size:1.15rem; color:var(--primario-osc); margin-bottom:4px;}
  .selector-hoja p.sub{font-size:.83rem; color:#64748b; margin-bottom:16px;}
  .selector-hoja h3{
    font-size:.78rem; text-transform:uppercase; letter-spacing:1px;
    color:#94a3b8; margin:16px 0 8px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid #cbd5e1; background:#fff; color:var(--primario-osc);
    border-radius:999px; padding:10px 18px; font-size:.92rem; font-weight:600; cursor:pointer;
  }
  .chip:active{background:var(--primario); color:#fff; border-color:var(--primario);}
  .selector-cerrar{
    width:100%; margin-top:18px; border:none; border-radius:12px; padding:13px;
    background:#e2e8f0; color:var(--primario-osc); font-size:.95rem; font-weight:700; cursor:pointer;
  }
  #visorPdf{
    display:none; width:100%; height:100%;
    border:none; border-radius:12px; background:#fff;
  }
</style>
</head>
<body>

<!-- ============ PANTALLA DE ACCESO ============ -->
<div id="login">
  <div class="login-caja">
    <div class="logo" id="logoLogin">
      <img src="logo.svg" alt="Logotipo del colegio" onerror="this.parentElement.textContent='🔒'">
    </div>
    <h2>Profes del Tossal</h2>
    <p class="sub">Zona reservada al profesorado · Introduce la contraseña</p>
    <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password">
    <div id="loginError"></div>
    <button id="entrarBtn">Acceder</button>
    <p class="login-info">Contraseña por defecto: <b>profes2026</b><br>(cámbiala en el código, constante CLAVE_ACCESO)</p>
  </div>
</div>

<header>
  <div class="logo" id="logoColegio" style="filter:drop-shadow(0 2px 6px rgba(30,64,175,.15))">
    <img src="logo.svg" alt="Logotipo del colegio" onerror="this.parentElement.textContent='🎓'">
  </div>
  <h1>Profes del Tossal</h1>
  <p>Zona docente · Acceso rápido a formularios y recursos</p>
</header>

<button id="installBtn">📲 Instalar aplicación</button>

<main class="grid" id="contenedor"></main>


<!-- ============ SELECTOR DE HORARIOS ============ -->
<div id="selector">
  <div class="selector-hoja">
    <h2>📋 Horarios</h2>
    <p class="sub">Selecciona el aula o docente para ver su horario</p>
    <div id="chipsGrupos"></div>
    <button class="selector-cerrar" id="selectorCerrar">Cancelar</button>
  </div>
</div>

<!-- ============ VISOR DE IMÁGENES ============ -->
<div id="visor">
  <button id="visorCerrar" aria-label="Cerrar">✕</button>
  <img id="visorImg" src="" alt="">
  <embed id="visorPdf" type="application/pdf">
</div>

<script>
/* ============ DATOS ============ */
const CLAVE = 'botonesProfes_v2';

/* ============ HORARIOS: edita esta lista ============
   'nombre' es lo que se muestra en el selector,
   'archivo' es el PDF/imagen dentro de la carpeta horarios/ */
const HORARIOS = [
  {grupo:'Departamentos',  nombre:'Biblioteca',       archivo:'construccion.svg'},
  {grupo:'Departamentos',  nombre:'Gimnasio',         archivo:'construccion.svg'},
  {grupo:'Departamentos',  nombre:'Informática',      archivo:'construccion.svg'},
  {grupo:'Departamentos',  nombre:'Multisensorial',   archivo:'construccion.svg'},
  {grupo:'Departamentos',  nombre:'Convivencia',      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'Infantil 2',               archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'Infantil 3',               archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'Infantil 4',               archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'Infantil 5',               archivo:'construccion.svg'},
  {grupo:'Aulas',      nombre:'AA1',                  archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'1º',                       archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'2º',                       archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'3ºA',                      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'3ºB',                      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'3ºC',                      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'4ºA',                      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'4ºB',                      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'5º',                       archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'6ºA',                      archivo:'construccion.svg'},
  {grupo:'Aulas',  nombre:'6ºB',                      archivo:'construccion.svg'},
  {grupo:'Aulas',      nombre:'AA2',                  archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Juan B.',               archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Manu',                  archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Nuria',                 archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Zara',                  archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Jaime',                 archivo:'jaime.svg'},
  {grupo:'Docentes',  nombre:'Antonio',               archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Pilar Valen',           archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Beatriz',               archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'María Ll.',             archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Pau',                   archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Claudia',               archivo:'construccion.svg'},
  {grupo:'Docentes',  nombre:'Silvia',                archivo:'construccion.svg'},
];


const PREDETERMINADOS = [
  {id:1, titulo:'Registro Conducta', url:'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=FBHdc33vx0CGaVadMufim8bX8FXnOx1Nl6MQ4RzpBRRUQ1JFNDZZSEpZUThIUk1BUTFWSDIwTzM4RCQlQCN0PWcu', icono:'Conducta.svg'},
  {id:2, titulo:'Patios', url:'imagenes/patios.svg' , icono:'Patios.svg'},
  {id:3, titulo:'Horarios', url:'#horarios', icono:'Horario.svg', emoji:'⏰'},
  {id:4, titulo:'Calendario', url:'https://outlook.cloud.microsoft/calendar/view/month', icono:'Calendario.svg'},
  {id:5, titulo:'Canva', url:'https://www.canva.com/folder/FAFx6bKMyEQ', icono:'Canva.svg'},
  {id:6, titulo:'OneDrive', url:'https://gvaedu-my.sharepoint.com/shared?id=%2Fsites%2FSection%5F03009749%2DC%2FDocumentos%20compartidos%2FGeneral&listurl=https%3A%2F%2Fgvaedu%2Esharepoint%2Ecom%2Fsites%2FSection%5F03009749%2DC%2FDocumentos%20compartidos&viewid=5a00f050%2D6116%2D4d4c%2D8fb4%2D97b743ea04b7', icono:'OneDrive.svg'},
  {id:7, titulo:'Formularios', url:'https://forms.cloud.microsoft/Pages/DesignPageV2.aspx?origin=shell&groupid=55f0d7c6-3be7-4d1d-97a3-10e11ce90514', icono:'Formulario.svg'},
  {id:8, titulo:'Guardias', url:'imagenes/construccion.svg', icono:'guardia.svg', emoji:'🏫'},
  {id:9, titulo:'Web Cole', url:'https://portal.edu.gva.es/eltossal/', icono:'webcole.svg', emoji:'🏫'},
];

function cargarBotones(){
  try{
    const d = JSON.parse(localStorage.getItem(CLAVE));
    if(Array.isArray(d)) return d;
  }catch(e){}
  return PREDETERMINADOS.slice();
}
function guardarBotones(b){ localStorage.setItem(CLAVE, JSON.stringify(b)); }
let botones = cargarBotones();

/* ============ RENDER ============ */
const contenedor = document.getElementById('contenedor');
function render(){
  contenedor.innerHTML = '';
  botones.forEach((b,i)=>{
    const a = document.createElement('a');
    a.className = 'btn-tarjeta';
    a.href = b.url; a.target = '_blank'; a.rel = 'noopener';
    if(b.url === '#horarios'){
      a.removeAttribute('target');
      a.addEventListener('click', e=>{ e.preventDefault(); abrirSelector(); });
    }
    if(esImagenLocal(b.url)){
      a.removeAttribute('target');
      a.addEventListener('click', e=>{ e.preventDefault(); abrirVisor(b.url); });
    }
    a.innerHTML = `
      <span class="icono">${b.emoji||''}<img src="icons/${b.icono}" alt="" onerror="this.remove()"></span>
      <span class="titulo">${escapar(b.titulo)}</span>`;
    contenedor.appendChild(a);
  });
}
function escapar(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


/* ============ PWA ============ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});




/* ============ ACCESO ============ */
const CLAVE_ACCESO = 'tic';             // <-- CAMBIA AQUÍ LA CONTRASEÑA
const SESION = 'accesoProfesTossal';
const loginDiv = document.getElementById('login');
const passInput = document.getElementById('passInput');
const loginError = document.getElementById('loginError');

function ocultarApp(){ document.querySelectorAll('header, main, #installBtn').forEach(e => e.style.visibility = 'hidden'); }
function mostrarApp(){ document.querySelectorAll('header, main, #installBtn').forEach(e => e.style.visibility = ''); }

function autenticar(){
  if(sessionStorage.getItem(SESION) === 'ok'){ loginDiv.classList.add('oculto'); mostrarApp(); return; }
  ocultarApp();
  setTimeout(()=>passInput.focus(), 100);
}
function intentar(){
  if(passInput.value === CLAVE_ACCESO){
    sessionStorage.setItem(SESION, 'ok');
    loginDiv.classList.add('oculto');
    mostrarApp();
  }else{
    loginError.textContent = 'Contraseña incorrecta, inténtalo de nuevo.';
    passInput.classList.add('err');
    setTimeout(()=>passInput.classList.remove('err'), 400);
    passInput.value = ''; passInput.focus();
  }
}
document.getElementById('entrarBtn').addEventListener('click', intentar);
passInput.addEventListener('keydown', e => { if(e.key === 'Enter') intentar(); });
autenticar();


/* ============ VISOR DE IMÁGENES ============ */
const visor = document.getElementById('visor');
const visorImg = document.getElementById('visorImg');
function esImagenLocal(url){
  return /^imagenes\//i.test(url) || /\.(svg|png|jpe?g|webp|gif)$/i.test(url);
}
function cerrarVisor(){
  visor.classList.remove('abierto');
  visorImg.src = '';
  const vp = document.getElementById('visorPdf');
  if(vp){ vp.src = ''; vp.style.display = 'none'; }
  visorImg.style.display = '';
  document.body.style.overflow = '';
}
document.getElementById('visorCerrar').addEventListener('click', cerrarVisor);
visor.addEventListener('click', e => { if(e.target === visor) cerrarVisor(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarVisor(); });


/* ============ SELECTOR DE HORARIOS ============ */
const selectorDiv = document.getElementById('selector');
const chipsGrupos = document.getElementById('chipsGrupos');
const visorPdf = document.getElementById('visorPdf');
const visorImgEl = document.getElementById('visorImg');

function construirSelector() {
  chipsGrupos.innerHTML = '';
  const grupos = [...new Set(HORARIOS.map(h => h.grupo))];
  
  grupos.forEach(g => {
    const h3 = document.createElement('h3');
    
    // Añades el caso para la nueva categoría (ej: 'Departamentos')
    if (g === 'Aulas') {
      h3.textContent = '🏫 Aulas';
    } else if (g === 'Departamentos') {
      h3.textContent = '🏢 Espacio';
    } else {
      h3.textContent = '🧑‍🏫 Docentes';
    }
        chipsGrupos.appendChild(h3);
    const cont = document.createElement('div');
    cont.className = 'chips';
    
    HORARIOS.filter(h => h.grupo === g).forEach(h => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = h.nombre;
      b.addEventListener('click', () => { cerrarSelector(); abrirVisor('horarios/' + h.archivo); });
      cont.appendChild(b);
    });
    chipsGrupos.appendChild(cont);
  });
}
function abrirSelector(){ construirSelector(); selectorDiv.classList.add('abierto'); }
function cerrarSelector(){ selectorDiv.classList.remove('abierto'); }
document.getElementById('selectorCerrar').addEventListener('click', cerrarSelector);
selectorDiv.addEventListener('click', e => { if(e.target === selectorDiv) cerrarSelector(); });

/* visor: PDF con embed, imágenes con img */
function abrirVisor(url){
  if(/\.pdf$/i.test(url)){
    visorImgEl.style.display = 'none';
    visorPdf.style.display = 'block';
    visorPdf.src = url;
  }else{
    visorPdf.style.display = 'none';
    visorPdf.src = '';
    visorImgEl.style.display = '';
    visorImgEl.src = url;
  }
  visor.classList.add('abierto');
  document.body.style.overflow = 'hidden';
}

render();
</script>
</body>
</html>
